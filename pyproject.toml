[project]
name = "lume"
version = "2.0.0"
description = "Lume V2.0 — análise de segurança web com motores comportamental e de infraestrutura"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name="Lume Security Team", email="security@lume.local"}]
license = {text = "MIT"}

keywords = [
    "security",
    "vulnerability-scanner",
    "web-security",
    "penetration-testing",
    "owasp",
    "reconnaissance",
    "behavioral-analysis",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1.0",
    "click-shell>=2.1",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "python-nmap>=0.0.1",
    "dnspython>=2.6.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.3",
    "zaproxy>=0.5.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
    "sslyze>=5.3.0",
    "jinja2>=3.1.2",
    "pdfkit>=1.0.0",
    "python-dateutil>=2.8.2",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
]

[project.scripts]
lume = "lume.cli.main:cli"

[project.urls]
Repository = "https://github.com/lume-security/lume"
Documentation = "https://github.com/lume-security/lume/wiki"
Issues = "https://github.com/lume-security/lume/issues"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lume"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
