<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatório de Segurança Lume</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f8fafc; color: #111827; margin: 0; padding: 24px; }
      h1 { color: #1f2937; }
      .section { margin-bottom: 24px; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { border: 1px solid #d1d5db; padding: 10px; text-align: left; }
      th { background: #e5e7eb; }
    </style>
  </head>
  <body>
    <h1>Relatório Lume</h1>
    <p>Relatório de segurança gerado pelo backend do Lume V2.0.</p>
    <div class="section">
      <h2>Resumo</h2>
      <p>Alvo: {{ target }}</p>
      <p>Status: {{ success }}</p>
    </div>

    <div class="section">
      <h2>Resultados</h2>
      <table>
        <thead>
          <tr>
            <th>Tipo</th>
            <th>Detalhes</th>
          </tr>
        </thead>
        <tbody>
          {% for result in results %}
          <tr>
            <td>{{ result.type }}</td>
            <td>{{ result }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
